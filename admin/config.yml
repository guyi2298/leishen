backend:
  name: github
  repo: guyi2298/leishen
  branch: main
  auth_type: oauth
  site_url: "https://guyi2298.github.io/leishen/"
  base_url: "https://decap-cms-oauth.netlify.app"
  auth_endpoint: "auth"

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "cases"
    label: "Cases"
    folder: "content/cases"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", default: "" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Scope", name: "scope", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", default: "" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        file: "content/about/_index.md"
        label: "About Page"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "contact"
        file: "content/contact/_index.md"
        label: "Contact Page"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
